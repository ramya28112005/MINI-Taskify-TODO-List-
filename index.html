
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taskify | Smart Todo List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card task-card p-4 p-md-5">

                    <!-- Header -->
                    <div class="app-header">
                        <div class="brand-icon">✓</div>
                        <h1 class="card-title">Taskify</h1>
                        <p class="subtitle">Plan your day. Get things done.</p>
                        <p id="todayDate" class="today-date"></p>
                    </div>

                    <!-- Statistics -->
                    <div class="row g-3 stats-row">
                        <div class="col-4">
                            <div class="stat-box total-box">
                                <span class="stat-icon">📋</span>
                                <h3 id="totalTasks">0</h3>
                                <p>Total</p>
                            </div>
                        </div>

                        <div class="col-4">
                            <div class="stat-box pending-box">
                                <span class="stat-icon">⏳</span>
                                <h3 id="pendingTasks">0</h3>
                                <p>Pending</p>
                            </div>
                        </div>

                        <div class="col-4">
                            <div class="stat-box completed-box">
                                <span class="stat-icon">🎯</span>
                                <h3 id="completedTasks">0</h3>
                                <p>Completed</p>
                            </div>
                        </div>
                    </div>

                    <!-- Progress -->
                    <div class="progress-section">
                        <div class="progress-heading">
                            <span>Your progress</span>
                            <span id="progressPercentage">0%</span>
                        </div>

                        <div class="progress-track">
                            <div id="progressBar" class="progress-fill"></div>
                        </div>

                        <p id="progressMessage">Let's get started!</p>
                    </div>

                    <!-- Add task -->
                    <h2 class="section-title">My Tasks</h2>

                    <div class="input-group task-input-group mb-3">
                        <input
                            class="form-control"
                            type="text"
                            id="todoInput"
                            placeholder="What do you need to do?"
                            aria-label="Enter a new task"
                            maxlength="200"
                        >

                        <button class="btn" id="addTodoButton">
                            + Add Task
                        </button>
                    </div>

                    <p id="message" role="status" aria-live="polite"></p>

                    <!-- Filters -->
                    <div class="filter-section">
                        <button class="filter-btn active" data-filter="all">
                            All
                        </button>

                        <button class="filter-btn" data-filter="pending">
                            Pending
                        </button>

                        <button class="filter-btn" data-filter="completed">
                            Completed
                        </button>
                    </div>

                    <!-- Task list -->
                    <ul id="todoList" class="list-group"></ul>

                    <!-- Empty state -->
                    <div id="emptyState" class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h3 id="emptyTitle">Your task list is empty</h3>
                        <p id="emptyMessage">
                            Add your first task and make today productive!
                        </p>
                    </div>

                    <div class="footer-note">
                        Made for a more productive day ✨
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="./script.js"></script>
</body>
</html>
